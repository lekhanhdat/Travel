name: CI

on:
  push:
    branches: [main, improve, 'migration/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Recovery + catalog suites; AzureTranslatorService/semantic.api fail since before migration and are not gated.
      - name: Jest (recovery + catalog)
        run: >
          node node_modules/jest/bin/jest.js --runInBand
          __tests__/services/catalog.api.test.js __tests__/services/catalog.contract.test.js
          __tests__/services/catalogDisplay.test.js __tests__/services/catalogSearch.test.js
          __tests__/i18n/translationHelpers.test.ts __tests__/i18n/i18n.test.ts
          __tests__/guestMode.test.js __tests__/guestNavigation.test.js __tests__/guestTranslation.test.js
          __tests__/mapScreen.test.js __tests__/env.test.js
          __tests__/services/auth.api.test.js __tests__/authFlow.test.js __tests__/newFeed.test.js
      - name: tsc (baseline 62 errors, must not grow)
        run: |
          count=$(node node_modules/typescript/bin/tsc --noEmit | grep -c "error TS" || true)
          echo "tsc errors: $count (baseline 62)"
          test "$count" -le 62
