buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        googlePlayServicesLocationVersion = "21.0.1"
        RNMapboxMapsImpl = "mapbox"
    }
    repositories {
        google()
        mavenCentral()
    //   maven { url("${project(':react-native-background-geolocation').projectDir}/libs") }
    //   maven { url("${project(':react-native-background-fetch').projectDir}/libs") }

    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
// Download credentials stay in the gitignored local.properties or Gradle user properties.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapboxDownloadsToken = findProperty("MAPBOX_DOWNLOADS_TOKEN") ?: localProperties.getProperty("MAPBOX_DOWNLOADS_TOKEN", "")

allprojects {
    repositories {
        google()
        mavenCentral()
        // maven { url("${project(':react-native-background-geolocation').projectDir}/libs") }
        // maven { url("${project(':react-native-background-fetch').projectDir}/libs") } // REMOVED - unused
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                // Do not change the username below.
                // This should always be `mapbox` (not your username).
                username = 'mapbox'
                // Use the secret token you stored in gradle.properties as the password
                password = mapboxDownloadsToken
            }
        }
    }
}
// Libraries without an explicit tools version otherwise request AGP's 35.0.0 default.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}
